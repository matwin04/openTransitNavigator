<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>{{ title }}</title>

        <link rel="stylesheet" href="/public/styles/main.css" />
        <link href="/public/images/favicon.ico" rel="shortcut icon" type="image/x-icon" />

        <!-- MapLibre GL JS CSS -->
        <link href="https://unpkg.com/maplibre-gl@3.5.2/dist/maplibre-gl.css" rel="stylesheet" />

        <script src="https://unpkg.com/maplibre-gl@3.5.2/dist/maplibre-gl.js"></script>
    </head>
    <body>
        {{> navbar }}
        <div id="map"></div>
        <div id="info">
            <div id="station"></div>
            <button onclick="loadAgencies()">Agencies</button>
            <button onclick="loadStations()">Stations</button>
            <button onclick="loadTrips()">Trips</button>
            <button onclick="loadVehicles()">Vehicles</button>
            <button onclick="loadRoutes()">Routes</button>
            <table>
                <thead></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        <script src="/public/scripts/map.js"></script>
        <script src="/public/scripts/script.js"></script>
    </body>
</html>
