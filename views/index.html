<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>{{ title }}</title>

        <link rel="stylesheet" href="/public/styles/main.css" />
        <link href="/public/images/favicon.ico" rel="shortcut icon" type="image/x-icon" />
        <!-- MapLibre GL JS CSS -->
        <link href="https://unpkg.com/maplibre-gl@3.5.2/dist/maplibre-gl.css" rel="stylesheet" />

        <script src="https://unpkg.com/maplibre-gl@3.5.2/dist/maplibre-gl.js"></script>
    </head>
    <body>
        {{> navbar }}
        <h1 class="title">OpenTransitNavigator</h1>
        <p class="subtitle">Making transit easier!</p>
        <div id="map"></div>
        <div id="info">
            <h1 class="title is-3">Agencies</h1>
        <table>
            <thead>

            </thead>
            <tbody>
            {{#each agencies}}
            <tr>
                <th>
                    <a href="/agencies/{{agency_id}}">{{agency_id}}</a></th>
                <td>{{agency_name}}</td>
                <td>{{agency_url}}</td>
            </tr>
            {{/each}}
            </tbody>
        </table>
        </div>
        <script src="/public/scripts/map.js"></script>

    </body>
</html>
